<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div class="container">
    <h1 class="text-center mb-4">TODO App</h1>
    <!-- Input Row -->
    <div class="row g-2 align-items-center mb-4">
      <div class="col-md-5">
        <input type="text" class="form-control" placeholder="Enter task" id="taskName">
      </div>
      <div class="col-md-4">
        <input type="date" class="form-control" id="taskDate">
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary w-100"  onclick="addData()">Add Task</button>
      </div>
    </div>

    <!-- Task List Placeholder -->
    <div id="taskList">
      <!-- Example static task -->

    </div>
  </div>

<script src="/01.js"></script>
</body>
</html>
